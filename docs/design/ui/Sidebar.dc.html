<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tally-tokens.css">
<link rel="stylesheet" href="ds/tally/components/bundle.css">
<script src="ds/tally/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.tcs-root,.tcs-root *{box-sizing:border-box}
.tcs-root{font-family:var(--font-sans,"Geist","Inter",ui-sans-serif,system-ui,sans-serif)}
.tcs-nav{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:8px;color:var(--foreground-muted);font-weight:500;font-size:13px;line-height:18px;cursor:pointer;transition:background-color 160ms cubic-bezier(0.2,0,0,1),color 160ms cubic-bezier(0.2,0,0,1)}
.tcs-nav:hover{background:var(--surface-hover);color:var(--foreground)}
.tcs-nav.on{background:var(--surface-active);color:var(--foreground)}
.tcs-nav:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.tcs-cap{font-weight:500;font-size:12px;line-height:16px;letter-spacing:0.01em;color:var(--foreground-subtle);margin:0;padding:12px 20px 4px}
.tcs-mono{font-family:var(--font-mono,"Geist Mono","JetBrains Mono",ui-monospace,monospace);font-size:12px;line-height:18px;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div class="tc tcs-root" data-theme="{{d.theme}}" style="width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--border); color: var(--foreground);">
<div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; padding: 0 20px;">
<x-import component-from-global-scope="Tally.Logo" size="{{n22}}" wordmark="{{yes}}"></x-import>
</div>
<div style="padding: 4px 12px 8px; display: flex; flex-direction: column; gap: 8px;">
<div onClick="{{d.newThread}}" style="display: flex;">
<x-import component-from-global-scope="Tally.Button" variant="secondary" icon="message-plus" style="flex: 1;">New thread <x-import component-from-global-scope="Tally.Kbd">⌘⇧O</x-import></x-import>
</div>
<x-import component-from-global-scope="Tally.Input" placeholder="Search titles  ⌘K" value="{{d.search}}" aria-label="Search thread titles"></x-import>
</div>
<nav aria-label="Threads" style="flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 8px;">
<sc-for list="{{d.groups}}" as="grp" hint-placeholder-count="3">
<p class="tcs-cap">{{grp.label}}</p>
<sc-for list="{{grp.items}}" as="it" hint-placeholder-count="3">
<div onClick="{{it.pick}}">
<x-import component-from-global-scope="Tally.ThreadItem" title="{{it.title}}" active="{{it.active}}" streaming="{{it.streaming}}" unread="{{it.unread}}" cost="{{it.cost}}"></x-import>
</div>
</sc-for>
</sc-for>
</nav>
<div style="flex-shrink: 0; border-top: 1px solid var(--border); padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 2px;">
<sc-for list="{{d.nav}}" as="nv" hint-placeholder-count="3">
<button class="tcs-nav {{nv.cls}}" onClick="{{nv.go}}">
<x-import component-from-global-scope="Tally.Icon" name="{{nv.icon}}" size="{{n16}}"></x-import>
<span>{{nv.label}}</span>
</button>
</sc-for>
<div style="margin-top: 10px; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-raised); display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; align-items: center; gap: 8px;">
<span style="font-weight: 600; font-size: 11px; line-height: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--foreground-muted); flex: 1;">Today</span>
<span class="tcs-mono" style="color: var(--foreground);">{{d.budget.amount}}</span>
<span class="tcs-mono" style="color: var(--foreground-muted);">/ $5.00</span>
</div>
<x-import component-from-global-scope="Tally.ProgressBar" value="{{d.budget.value}}" label="{{d.budget.label}}"></x-import>
<sc-if value="{{d.budNear}}" hint-placeholder-val="{{no}}"><div><x-import component-from-global-scope="Tally.Badge" tone="warning" dot="{{yes}}">Near limit</x-import></div></sc-if>
<sc-if value="{{d.budPaused}}" hint-placeholder-val="{{no}}"><div><x-import component-from-global-scope="Tally.Badge" tone="danger" dot="{{yes}}">Sending paused</x-import></div></sc-if>
<sc-if value="{{d.budOverride}}" hint-placeholder-val="{{no}}"><div><x-import component-from-global-scope="Tally.Badge" tone="info" dot="{{yes}}">Override on for today</x-import></div></sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"d":{"editor":null},"$preview":{"width":264,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.d || {
      theme: 'light', search: '',
      newThread: () => {},
      groups: [
        { label: 'Today', items: [{ title: 'Cache-aware request layout', active: true, cost: '$0.48' }, { title: 'Keepalive cost per hour', streaming: true }] },
        { label: 'Yesterday', items: [{ title: 'Refactor billing webhooks', cost: '$0.22' }, { title: 'Tencent TKE pod restarts', unread: true, cost: '$0.09' }] },
        { label: 'Last 7 days', items: [{ title: 'Postgres index for usage table', cost: '$0.31' }, { title: 'OpenRouter fallback order', cost: '$0.05' }] },
        { label: 'Older', items: [{ title: 'Go worker pool review', cost: '$1.12' }] }
      ],
      nav: [{ label: 'Usage', icon: 'chart-bar', cls: '', go: () => {} }, { label: 'Providers', icon: 'plug-connected', cls: '', go: () => {} }, { label: 'Settings', icon: 'settings', cls: '', go: () => {} }],
      budget: { value: 37, label: '37% of $5.00', amount: '$1.84' },
      budOk: true, budNear: false, budPaused: false, budOverride: false
    };
    return { d: d, yes: true, no: false, n16: 16, n22: 22 };
  }
}
</script>
</body>
</html>
