<!doctype html>
<!--
  PROTOTYPE, throwaway. Not production code.
  Question: where should the cost layer live in a claude.ai-style chat, and is the density right?
  Three structurally different variants, switchable via ?variant=A|B|C and the floating bar (or ← →).
    A  Rail          - doc as written: cost strip under composer, meta line per message, inspector right rail
    B  Context bar   - context window as a segmented bar on top, inspector as a popover, meta behind a pill
    C  Margin tally  - per-turn cost and running total in a right margin, inspector as a bottom drawer
  Run: open prototypes/cost-layer-ui.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tally.chat prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f0; --panel: #fbfaf7; --card: #ffffff; --line: #e6e1d6; --line-2: #d9d2c3;
  --ink: #2a2723; --ink-2: #57514a; --muted: #6e675e; --user-bg: #efebe2;
  --accent: #9a6a12; --accent-soft: #f3e7cf;
  --warm: #2f7d4f; --warm-soft: #e1f0e5; --keep: #9a6a12; --keep-soft: #f3e7cf; --cold: #5b6878; --cold-soft: #e7eaee;
  --danger: #a33a2a; --shadow: 0 1px 2px rgba(40,30,10,.06), 0 4px 16px rgba(40,30,10,.06);
  --serif: "Source Serif 4", Georgia, serif; --sans: Inter, system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1f1e1c; --panel: #252422; --card: #2b2a27; --line: #3a3834; --line-2: #4a4741;
  --ink: #ece8e0; --ink-2: #c9c3b8; --muted: #a39c90; --user-bg: #34322e;
  --accent: #d9a54a; --accent-soft: #3d3220;
  --warm: #6cc28d; --warm-soft: #1f3528; --keep: #d9a54a; --keep-soft: #3d3220; --cold: #9aa6b5; --cold-soft: #2c3038;
  --danger: #e07a68; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
}}
:root[data-theme="dark"] {
  --bg: #1f1e1c; --panel: #252422; --card: #2b2a27; --line: #3a3834; --line-2: #4a4741;
  --ink: #ece8e0; --ink-2: #c9c3b8; --muted: #a39c90; --user-bg: #34322e;
  --accent: #d9a54a; --accent-soft: #3d3220;
  --warm: #6cc28d; --warm-soft: #1f3528; --keep: #d9a54a; --keep-soft: #3d3220; --cold: #9aa6b5; --cold-soft: #2c3038;
  --danger: #e07a68; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.app { display: flex; height: 100vh; overflow: hidden; }

/* sidebar */
.sidebar { width: 260px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 12px; gap: 4px; }
.brand { font-weight: 600; font-size: 15px; padding: 6px 8px 12px; display: flex; align-items: center; gap: 8px; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); color: var(--card); display: grid; place-items: center; font: 600 12px var(--mono); }
.new-btn { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; font-weight: 500; }
.new-btn:hover, .thread-item:hover { background: var(--user-bg); }
.side-label { font-size: 12px; color: var(--muted); padding: 14px 10px 4px; }
.thread-item { display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 8px; color: var(--ink-2); text-align: left; width: 100%; }
.thread-item.active { background: var(--user-bg); color: var(--ink); }
.thread-item .num { font-size: 11px; color: var(--muted); flex: none; }
.side-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.budget { padding: 4px 10px; font-size: 12px; color: var(--muted); }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.icon-rail { width: 56px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 8px; }
.icon-btn { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-2); }
.icon-btn:hover { background: var(--user-bg); }

/* main */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.header { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid transparent; }
.title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spacer { flex: 1; }
.picker { position: relative; white-space: nowrap; flex: none; display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-size: 13px; }
.picker .num { color: var(--muted); font-size: 11px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font: 500 12px var(--sans); white-space: nowrap; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.warm { color: var(--warm); background: var(--warm-soft); }
.chip.keepalive { color: var(--keep); background: var(--keep-soft); }
.chip.keepalive .dot { animation: pulse 1.6s ease-in-out infinite; }
.chip.cold { color: var(--cold); background: var(--cold-soft); }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .chip.keepalive .dot { animation: none; } }
.scroll { flex: 1; overflow-y: auto; }
.column { max-width: 720px; margin: 0 auto; padding: 8px 24px 24px; }

/* messages */
.msg { margin: 22px 0; position: relative; }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user > div { max-width: 80%; display: flex; flex-direction: column; align-items: flex-end; }
.msg.user .bubble { max-width: none; }
.bubble { background: var(--user-bg); padding: 10px 14px; border-radius: 14px; max-width: 80%; }
.answer { font: 16.5px/1.65 var(--serif); color: var(--ink); }
.answer p { margin: 0 0 10px; }
.answer ul { margin: 0 0 10px; padding-left: 22px; }
.meta { margin-top: 6px; font: 12px/1.4 var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.meta button:hover { color: var(--ink); text-decoration: underline; }
.sep { opacity: .5; }
.branch { display: inline-flex; align-items: center; gap: 2px; font: 12px var(--mono); color: var(--muted); }
.branch button { padding: 0 4px; border-radius: 4px; }
.branch button:hover { background: var(--user-bg); color: var(--ink); }
.msg-actions { display: flex; gap: 4px; justify-content: flex-end; margin-top: 4px; opacity: 0; transition: opacity .12s; }
.msg:hover .msg-actions, .msg:focus-within .msg-actions { opacity: 1; }
.act { font-size: 12px; color: var(--muted); padding: 2px 8px; border-radius: 6px; position: relative; }
.act:hover { background: var(--user-bg); color: var(--ink); }
.hint { position: absolute; bottom: calc(100% + 6px); right: 0; white-space: nowrap; background: var(--ink); color: var(--bg); font: 11.5px var(--mono); padding: 4px 8px; border-radius: 6px; pointer-events: none; opacity: 0; transform: translateY(2px); transition: .12s; z-index: 5; }
.act:hover .hint, .act:focus-visible .hint, .picker:hover .hint { opacity: 1; transform: none; }
.pinned { border-left: 2px solid var(--accent); padding-left: 12px; }
.pin-label { font: 11px var(--mono); color: var(--accent); margin-bottom: 4px; }

/* condensed fold */
.fold { border: 1px dashed var(--line-2); border-radius: 10px; padding: 10px 14px; font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.fold .num { color: var(--muted); }
.fold button { color: var(--accent); font-weight: 500; }
.fold-body { margin-top: 10px; }
.fold-body .ghost { opacity: .5; }
.ghost-tag { font: 11px var(--mono); color: var(--muted); }
.summary { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; color: var(--ink-2); margin-top: 8px; }

/* composer */
.composer-wrap { flex: none; padding: 0 24px 64px; } /* bottom room for the prototype switcher */
.composer { max-width: 720px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 12px 14px 10px; }
.composer textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink); font: 15px/1.5 var(--sans); min-height: 24px; max-height: 160px; }
.composer textarea::placeholder { color: var(--muted); }
.comp-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.pill-btn { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); position: relative; }
.pill-btn:hover { background: var(--user-bg); }
.send { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: var(--card); display: grid; place-items: center; font-weight: 600; }
.strip { max-width: 720px; margin: 6px auto 0; font: 12px var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 3px 8px; border-radius: 8px; width: fit-content; }
.strip:hover { background: var(--user-bg); color: var(--ink); }

/* inspector */
.inspector { font: 12.5px/1.5 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.insp-h { font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
.insp-h:first-child { margin-top: 0; }
.row { display: grid; grid-template-columns: 1fr auto 52px; gap: 10px; padding: 3px 0; align-items: baseline; }
.row .r { text-align: right; }
.row.total { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 7px; color: var(--ink); }
.tag { font-size: 11px; padding: 0 6px; border-radius: 4px; text-align: center; }
.tag.cached { color: var(--warm); background: var(--warm-soft); }
.tag.fresh { color: var(--cold); background: var(--cold-soft); }
.good { color: var(--warm); }
.layerbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); margin: 6px 0 2px; }
.layerbar i { display: block; height: 100%; }
.insp-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; font-family: var(--sans); }
.rail { width: 320px; flex: none; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 16px; }
.rail-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 600; }

/* variant B */
.ctxbar-wrap { position: sticky; top: 0; z-index: 4; background: linear-gradient(var(--bg) 75%, transparent); padding: 6px 0 12px; }
.ctxbar { width: 100%; display: block; text-align: left; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
.ctxbar:hover { border-color: var(--line-2); }
.ctx-top { display: flex; justify-content: space-between; gap: 8px; font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.ctx-top b { color: var(--ink); font-weight: 500; }
.ctx-legend { display: flex; gap: 12px; font: 11px var(--mono); color: var(--muted); margin-top: 4px; flex-wrap: wrap; }
.ctx-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
.popover { position: absolute; left: 0; right: 0; top: calc(100% - 6px); background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; }
.cost-pill { font: 11.5px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin-top: 6px; }
.cost-pill:hover { color: var(--ink); border-color: var(--line-2); }

/* variant C */
.tally-grid { max-width: 940px; margin: 0 auto; padding: 8px 24px 24px; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) 170px; gap: 28px; }
.gutter { border-left: 1px solid var(--line); padding: 22px 0 0 14px; font: 12px/1.6 var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.gutter .cost { color: var(--ink); font-size: 13px; }
.gutter .run { color: var(--accent); }
.gutter-head { font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.drawer { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.12); padding: 10px 24px 80px; transform: translateY(100%); visibility: hidden; transition: transform .2s ease, visibility .2s; z-index: 6; max-height: 70vh; overflow-y: auto; }
.drawer.open { transform: none; visibility: visible; }
.drawer-inner { max-width: 720px; margin: 0 auto; }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 0 auto 12px; }
.drawer-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

/* prototype switcher: deliberately not part of the design */
.proto { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 4px; background: #111; color: #fff; border-radius: 999px; padding: 4px; box-shadow: 0 6px 24px rgba(0,0,0,.35); border: 1px solid #555; font: 500 12.5px var(--sans); }
.proto button { color: #fff; padding: 6px 10px; border-radius: 999px; }
.proto button:hover { background: #333; }
.proto .lbl { padding: 0 8px; min-width: 150px; text-align: center; }
.proto .div { width: 1px; height: 18px; background: #444; }

/* mobile */
@media (max-width: 760px) {
  .sidebar, .icon-rail, .rail { display: none; }
  .column, .tally-grid { padding: 8px 16px 24px; }
  .composer-wrap { padding: 0 16px 64px; }
  .trow { grid-template-columns: 1fr; gap: 0; }
  .gutter { border-left: 0; padding: 4px 0 0; display: flex; gap: 10px; flex-wrap: wrap; }
  .gutter-head { display: none; }
  .picker .num, .hide-sm { display: none; }
  .drawer-cols { grid-template-columns: 1fr; }
  .sheet-mobile { position: fixed; inset: auto 0 0 0; max-height: 75vh; overflow-y: auto; background: var(--card); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.2); padding: 10px 16px 80px; z-index: 40; }
}
.sheet-mobile { display: none; }
@media (max-width: 760px) { .sheet-mobile { display: block; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div id="root"></div>
<div class="proto" role="toolbar" aria-label="Prototype variant switcher">
  <button id="prev" aria-label="Previous variant">←</button>
  <span class="lbl" id="lbl"></span>
  <button id="next" aria-label="Next variant">→</button>
  <span class="div"></span>
  <button id="theme" aria-label="Toggle theme">◐</button>
</div>
<script>
// ---------- fake data ----------
const D = {
  thread: "Kyoto trip in April",
  model: { name: "Sonnet 5.5", price: "$2 / $10 · read $0.10" },
  cache: "keepalive", // warm | keepalive | cold
  threads: [["Kyoto trip in April", "$0.18"], ["Convex aggregate rollups", "$0.42"], ["Rewrite resume summary", "$0.03"], ["Postgres vs Convex", "$0.11"], ["Sourdough hydration", "$0.01"]],
  layers: [
    { name: "system", tok: 412, state: "cached", color: "var(--cold)" },
    { name: "summary of turns 1-8", tok: 1240, state: "cached", color: "var(--accent)" },
    { name: "pinned (turn 2)", tok: 96, state: "cached", color: "var(--accent)" },
    { name: "turns 9-10", tok: 6830, state: "cached", color: "var(--warm)" },
    { name: "turn 11", tok: 1100, state: "fresh", color: "var(--line-2)" },
  ],
  window: 200000,
  totals: { turn: "$0.0043", upkeep: "$0.0030", thread: "$0.1820", saved: "$0.0910", hit: "87%", reasoning: "1,430", nextCondense: "~8k tok" },
  pinned: { turn: 2, text: "Budget is 250k JPY for two people, both vegetarian. No early flights." },
  summary: "Planning 6 days in Kyoto, Apr 8-13, two vegetarian travelers, 250k JPY budget. Staying near Shijo. Day 1 Higashiyama, day 2 Arashiyama, day 3 Nara day trip was replaced with Fushimi Inari + Tofuku-ji. Prefers trains over taxis, no early flights.",
  turns: [
    { n: 9, user: "Can you rebalance day 3 so we're not crossing the city twice?",
      answers: [{ html: "<p>Yes. Swap the order so you move in one direction, south to north:</p><ul><li><b>Morning:</b> Fushimi Inari, then Tofuku-ji (one stop on the Keihan line).</li><li><b>Lunch:</b> Shigetsu-style shojin ryori near Gion, all vegetarian.</li><li><b>Afternoon:</b> Kennin-ji and a slow walk up Hanamikoji.</li></ul><p>That cuts about 40 minutes of transit and keeps you on one train line until lunch.</p>",
        meta: { cost: "$0.0061", in: "9.8k", cached: "84%", out: "212", reasoning: "0" } }] },
    { n: 10, user: "What about Fushimi Inari early morning? Worth it?",
      answers: [
        { html: "<p>Worth it. Before 8am the lower gates are nearly empty and the light through the torii is the best of the day.</p>", meta: { cost: "$0.0049", in: "10.3k", cached: "88%", out: "64", reasoning: "0" } },
        { html: "<p>Very much, with one caveat: you said no early flights, but nothing about early mornings. If you can be at the gate by 7:30, you skip the tour groups entirely. The full hike to the summit takes about 2 hours, but the best stretch is the first 30 minutes.</p>", meta: { cost: "$0.0052", in: "10.3k", cached: "88%", out: "98", reasoning: "0" } },
      ] },
    { n: 11, user: "Make a short packing list for rain.",
      answers: [{ html: "<p>April in Kyoto rains about one day in three. Pack light:</p><ul><li>Packable rain shell, not an umbrella for the shrine hikes</li><li>Shoes that slip off easily, for temples and ryokan</li><li>A small dry bag for the phone and rail pass</li><li>One warm layer; mornings are around 8°C</li></ul>",
        meta: { cost: "$0.0043", in: "12.4k", cached: "87%", out: "340", reasoning: "1.4k" } }] },
  ],
};
const runTotals = ["$0.1679", "$0.1777", "$0.1820"];
const state = { branch: { 10: 1 }, fold: false, inspector: false, draft: "" };

// ---------- shared bits ----------
const variants = { A: "Rail", B: "Context bar", C: "Margin tally" };
const params = new URLSearchParams(location.search);
let variant = variants[params.get("variant")] ? params.get("variant") : "A";
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmtTok = n => n.toLocaleString("en-US");
const estimate = () => {
  const draftTok = Math.ceil(state.draft.length / 4);
  const cost = (9678 * 0.10 + (1100 + draftTok) * 2 + 400 * 10) / 1e6; // cached read + fresh input + ~400 out
  return "~$" + cost.toFixed(4);
};
const chip = () => {
  const label = { warm: "warm", keepalive: "keepalive", cold: "cold" }[D.cache];
  const tip = { warm: "Cache expires in 3:12", keepalive: "Keeping cache warm while you're here · upkeep $0.0030", cold: "Cache expired · next send rewrites 9.7k tok" }[D.cache];
  return `<button class="chip ${D.cache}" title="${tip}" data-act="inspector"><span class="dot" aria-hidden="true"></span>cache ${label}</button>`;
};
const picker = () => `<button class="picker">${D.model.name} <span class="num">${D.model.price}</span><span class="hint">switching discards 9.7k cached tok · +$0.024</span></button>`;
const branchSw = t => t.answers.length < 2 ? "" :
  `<span class="branch"><button data-branch="${t.n}" data-dir="-1" aria-label="Previous version">‹</button>${state.branch[t.n] + 1}/${t.answers.length}<button data-branch="${t.n}" data-dir="1" aria-label="Next version">›</button></span>`;
const ans = t => t.answers[state.branch[t.n] ?? 0];
const metaLine = (t, a) => `<div class="meta">${branchSw(t)}${t.answers.length > 1 ? '<span class="sep">·</span>' : ""}<button data-act="inspector" title="Open this turn in the inspector">${D.model.name} <span class="sep">·</span> ${a.meta.cost} <span class="sep">·</span> ${a.meta.in} in (${a.meta.cached} cached) <span class="sep">·</span> ${a.meta.out} out${a.meta.reasoning !== "0" ? ` <span class="sep">·</span> ${a.meta.reasoning} reasoning` : ""}</button></div>`;
const userMsg = (t, editHint = true) => `<div class="msg user"><div><div class="bubble">${esc(t.user)}</div>${editHint ? `<div class="msg-actions"><button class="act">Edit<span class="hint">breaks cache from turn ${t.n} · +$0.0${t.n === 11 ? "02" : "18"}</span></button></div>` : ""}</div></div>`;
const actions = t => `<div class="msg-actions" style="justify-content:flex-start"><button class="act">Retry<span class="hint" style="left:0;right:auto">new sibling · cache kept</span></button><button class="act">Fork here</button><button class="act">Pin</button><button class="act">Copy</button></div>`;
const fold = () => `
  <div class="fold"><span>Turns 1-8 summarized</span><span class="num">1,240 tok</span><button data-act="fold">${state.fold ? "collapse" : "view summary · expand"}</button></div>
  ${state.fold ? `<div class="fold-body"><div class="summary"><div class="ghost-tag">checkpoint · in context</div>${D.summary}</div>
    <div class="msg ghost"><div class="ghost-tag">turn 1 · not in context</div><div class="bubble" style="max-width:100%">We're going to Kyoto Apr 8-13, help me plan.</div></div>
    <div class="msg ghost"><div class="ghost-tag">turns 3-8 · not in context</div></div></div>` : ""}
  <div class="msg pinned"><div class="pin-label">pinned · turn 2 · never condensed</div><div class="bubble" style="max-width:100%">${D.pinned.text}</div></div>`;
const composer = (inner = "") => `
  <div class="composer">
    <label class="sr" for="draft">Message</label>
    <textarea id="draft" rows="1" placeholder="Reply to tally...">${esc(state.draft)}</textarea>
    <div class="comp-row"><button class="pill-btn">+ Image</button><button class="pill-btn">Effort: low<span class="hint" style="right:auto;left:0">this turn only · cache kept</span></button><span class="spacer"></span>${inner}<button class="send" aria-label="Send">↑</button></div>
  </div>`;
const stripText = () => `<span class="est">${estimate()}</span> next <span class="sep">·</span> cache ${D.cache} <span class="sep">·</span> ${D.totals.hit} hit`;
const inspectorBody = (compact = false) => {
  const total = D.layers.reduce((s, l) => s + l.tok, 0);
  return `<div class="inspector">
    <div class="insp-h">Context window</div>
    ${compact ? "" : `<div class="layerbar" aria-hidden="true">${D.layers.map(l => `<i style="width:${l.tok / total * 100}%;background:${l.color}"></i>`).join("")}</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:6px">${fmtTok(total)} of ${fmtTok(D.window)} tok · ${(total / D.window * 100).toFixed(1)}%</div>`}
    ${D.layers.map(l => `<div class="row"><span>${l.name}</span><span class="r">${fmtTok(l.tok)}</span><span class="tag ${l.state}">${l.state}</span></div>`).join("")}
    <div class="insp-h">Cost</div>
    <div class="row"><span>this turn</span><span class="r" style="grid-column:2/4">${D.totals.turn}</span></div>
    <div class="row"><span>cache upkeep</span><span class="r" style="grid-column:2/4">${D.totals.upkeep}</span></div>
    <div class="row total"><span>thread total</span><span class="r" style="grid-column:2/4">${D.totals.thread}</span></div>
    <div class="row"><span>cache saved (net)</span><span></span><span class="r good">${D.totals.saved}</span></div>
    <div class="insp-h">Health</div>
    <div class="row"><span>cache hit rate</span><span class="r" style="grid-column:2/4">${D.totals.hit}</span></div>
    <div class="row"><span>reasoning tokens</span><span class="r" style="grid-column:2/4">${D.totals.reasoning}</span></div>
    <div class="row"><span>next condense</span><span class="r" style="grid-column:2/4">${D.totals.nextCondense}</span></div>
    <div class="insp-actions"><button class="pill-btn">Condense now<span class="hint" style="left:0;right:auto">rewrites 8.0k tok · +$0.020 once</span></button><button class="pill-btn">Fork here</button></div>
  </div>`;
};
const sidebar = () => `<aside class="sidebar">
  <div class="brand"><span class="brand-mark">t</span>tally.chat</div>
  <button class="new-btn">＋ New thread <span class="mono" style="margin-left:auto;font-size:11px;color:var(--muted)">⌘⇧O</span></button>
  <div class="side-label">Today</div>
  ${D.threads.map((t, i) => `<button class="thread-item ${i === 0 ? "active" : ""}"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t[0]}</span><span class="num">${t[1]}</span></button>`).join("")}
  <div class="side-foot">
    <div class="budget"><div style="display:flex;justify-content:space-between"><span>Today</span><span class="num">$0.77 / $2.00</span></div><div class="bar"><i style="width:38%"></i></div></div>
    <button class="thread-item">Usage <span class="num">/usage</span></button>
    <button class="thread-item">Settings</button>
  </div></aside>`;

// ---------- Variant A: Rail ----------
function VariantA() {
  return `<div class="app">${sidebar()}
  <main class="main">
    <header class="header"><span class="title">${D.thread}</span><span class="spacer"></span>${chip()}${picker()}<button class="icon-btn" data-act="inspector" aria-label="Toggle inspector (⌘I)" title="Inspector ⌘I">▥</button></header>
    <div class="scroll"><div class="column">
      ${fold()}
      ${D.turns.map(t => { const a = ans(t); return `${userMsg(t)}<div class="msg"><div class="answer">${a.html}</div>${metaLine(t, a)}${actions(t)}</div>`; }).join("")}
    </div></div>
    <div class="composer-wrap">${composer()}<button class="strip" data-act="inspector" style="display:flex">${stripText()}</button></div>
  </main>
  ${state.inspector ? `<aside class="rail" aria-label="Inspector"><div class="rail-head"><span>Inspector</span><button class="icon-btn" data-act="inspector" aria-label="Close inspector">✕</button></div>${inspectorBody()}</aside>
    <div class="sheet-mobile"><div class="rail-head"><span>Inspector</span><button class="icon-btn" data-act="inspector" aria-label="Close inspector">✕</button></div>${inspectorBody()}</div>` : ""}
  </div>`;
}

// ---------- Variant B: Context bar ----------
function VariantB() {
  const total = D.layers.reduce((s, l) => s + l.tok, 0);
  return `<div class="app">
  <main class="main">
    <header class="header"><button class="icon-btn" aria-label="Threads">☰</button><span class="title">${D.thread}</span><span class="spacer"></span>${chip()}${picker()}</header>
    <div class="scroll"><div class="column">
      <div class="ctxbar-wrap" style="position:sticky">
        <div style="position:relative">
          <button class="ctxbar" data-act="inspector" aria-expanded="${state.inspector}">
            <div class="ctx-top"><span><b>${fmtTok(total)}</b> tok in context · ${(total / D.window * 100).toFixed(1)}% of window</span><span>thread <b>${D.totals.thread}</b> · saved <span class="good">${D.totals.saved}</span> · ${D.totals.hit} hit</span></div>
            <div class="layerbar">${D.layers.map(l => `<i style="width:${l.tok / total * 100}%;background:${l.color}"></i>`).join("")}</div>
            <div class="ctx-legend">${D.layers.map(l => `<span><i style="background:${l.color}"></i>${l.name.replace(" (turn 2)", "")}</span>`).join("")}</div>
          </button>
          ${state.inspector ? `<div class="popover">${inspectorBody(true)}</div>` : ""}
        </div>
      </div>
      ${fold()}
      ${D.turns.map(t => { const a = ans(t); return `${userMsg(t)}<div class="msg"><div class="answer">${a.html}</div>
        <div style="display:flex;gap:8px;align-items:center">${branchSw(t)}<button class="cost-pill" data-pill="${t.n}" title="${a.meta.in} in (${a.meta.cached} cached) · ${a.meta.out} out">${a.meta.cost}</button></div>
        <div class="meta" id="pill-${t.n}" hidden>${D.model.name} · ${a.meta.in} in (${a.meta.cached} cached) · ${a.meta.out} out${a.meta.reasoning !== "0" ? ` · ${a.meta.reasoning} reasoning` : ""}</div>${actions(t)}</div>`; }).join("")}
    </div></div>
    <div class="composer-wrap">${composer(`<span class="mono hide-sm" style="font-size:12px;color:var(--muted)"><span class="est">${estimate()}</span> next</span>`)}</div>
  </main></div>`;
}

// ---------- Variant C: Margin tally ----------
function VariantC() {
  return `<div class="app">
  <nav class="icon-rail"><span class="brand-mark">t</span><button class="icon-btn" aria-label="New thread">＋</button><button class="icon-btn" aria-label="Threads">☰</button><button class="icon-btn" aria-label="Usage">$</button></nav>
  <main class="main">
    <header class="header"><span class="title">${D.thread}</span><span class="spacer"></span>${chip()}${picker()}</header>
    <div class="scroll"><div class="tally-grid">
      <div class="trow"><div>${fold()}</div><div class="gutter"><div class="gutter-head">Turn · cost · running</div><div>1-8 · summarized</div><div class="run">$0.1618</div></div></div>
      ${D.turns.map((t, i) => { const a = ans(t); return `<div class="trow"><div>${userMsg(t)}<div class="msg"><div class="answer">${a.html}</div><div class="meta">${branchSw(t)}</div>${actions(t)}</div></div>
        <div class="gutter"><div>turn ${t.n}</div><div class="cost">${a.meta.cost}</div><div>${a.meta.in} in</div><div class="good">${a.meta.cached} cached</div><div>${a.meta.out} out</div>${a.meta.reasoning !== "0" ? `<div>${a.meta.reasoning} think</div>` : ""}<div class="run">Σ ${runTotals[i]}</div></div></div>`; }).join("")}
    </div></div>
    <div class="composer-wrap">${composer()}<button class="strip" data-act="inspector" style="display:flex">${stripText()} <span class="sep">·</span> details ↑</button></div>
    <div class="drawer ${state.inspector ? "open" : ""}" aria-hidden="${!state.inspector}"><div class="drawer-inner"><div class="grab"></div>
      <div class="drawer-cols"><div>${inspectorBody()}</div>
      <div class="inspector"><div class="insp-h">Last 7 days</div>
        ${[["Mon", 0.42], ["Tue", 0.31], ["Wed", 0.88], ["Thu", 0.54], ["Fri", 0.77], ["Sat", 0.12], ["Sun", 0.20]].map(([d, v]) => `<div class="row" style="grid-template-columns:36px 1fr auto"><span>${d}</span><span class="bar" style="margin:0;align-self:center"><i style="width:${v / 0.88 * 100}%"></i></span><span class="r">$${v.toFixed(2)}</span></div>`).join("")}
        <div class="row total" style="grid-template-columns:1fr auto"><span>cache saved this week</span><span class="r good">$1.24</span></div>
      </div></div>
    </div></div>
  </main></div>`;
}

// ---------- wiring ----------
const views = { A: VariantA, B: VariantB, C: VariantC };
function render() {
  const focused = document.activeElement?.id === "draft";
  const pos = focused ? document.activeElement.selectionStart : 0;
  document.getElementById("root").innerHTML = views[variant]();
  document.getElementById("lbl").textContent = `${variant} (${variants[variant]})`;
  const ta = document.getElementById("draft");
  ta.addEventListener("input", e => { state.draft = e.target.value; document.querySelectorAll(".est").forEach(n => n.textContent = estimate()); });
  if (focused) { ta.focus(); ta.setSelectionRange(pos, pos); }
  console.log("[prototype state]", { variant, ...state, cache: D.cache });
}
const setVariant = v => { variant = v; const p = new URLSearchParams(location.search); p.set("variant", v); history.replaceState(null, "", "?" + p); state.inspector = false; render(); };
const keys = Object.keys(variants);
const cycle = d => setVariant(keys[(keys.indexOf(variant) + d + keys.length) % keys.length]);
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
document.getElementById("theme").onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};
document.addEventListener("keydown", e => {
  const t = e.target, typing = t.matches?.("input, textarea, [contenteditable]");
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "i") { e.preventDefault(); state.inspector = !state.inspector; render(); return; }
  if (e.key === "Escape" && state.inspector) { state.inspector = false; render(); return; }
  if (typing) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});
document.getElementById("root").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.act === "inspector") { state.inspector = !state.inspector; render(); }
  else if (b.dataset.act === "fold") { state.fold = !state.fold; render(); }
  else if (b.dataset.branch) { const n = +b.dataset.branch, len = D.turns.find(t => t.n === n).answers.length; state.branch[n] = (state.branch[n] + +b.dataset.dir + len) % len; render(); }
  else if (b.dataset.pill) { const m = document.getElementById("pill-" + b.dataset.pill); m.hidden = !m.hidden; }
});
render();
</script>
</body>
</html>
